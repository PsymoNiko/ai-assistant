version: '3.8'

services:
  litellm:
    image: docker.litellm.ai/berriai/litellm-database:latest
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://litellm:litellm@db:5432/litellm
    secrets:
      - litellm_master_key
      - litellm_salt_key
      - litellm_api_key
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
      POSTGRES_DB: litellm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

secrets:
  litellm_master_key:
    file: ./secrets/litellm_master_key.txt
  litellm_salt_key:
    file: ./secrets/litellm_salt_key.txt
  litellm_api_key:
    file: ./secrets/litellm_api_key.txt

volumes:
  postgres_data:
