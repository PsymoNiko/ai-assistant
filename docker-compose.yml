version: '3.8'

services:
  gateway:
    build: ./src/backend/gateway
    image: ai-assistant-gateway:latest
    container_name: ai_gateway
    ports:
      - "8080:8080"
    environment:
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/ai-gateway
      - LITELLM_URL=http://litellm:4000/v1/chat/completions
    depends_on:
      - n8n

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
    volumes:
      - n8n_data:/home/node/.n8n

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_assistant
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    container_name: ai_redis
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  minio:
    image: minio/minio:latest
    container_name: minio
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server /data
    ports:
      - "9000:9000"
    volumes:
      - minio_data:/data

  litellm:
    image: ghcr.io/paul-vee/litellm:latest
    container_name: litellm
    # This is a placeholder image reference — replace with your local LLM runtime image if needed
    ports:
      - "4000:4000"

volumes:
  n8n_data:
  pg_data:
  qdrant_storage:
  minio_data:
