global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'zabbix_exporter'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['zabbix_exporter:9116']
    honor_labels: true
